# Local production-like run (optional). Coolify uses the Dockerfile alone.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@kurdistanathletes.com
      ADMIN_PASSWORD: ChangeThisPassword123!
    volumes:
      - app-data:/app/data

volumes:
  app-data:
