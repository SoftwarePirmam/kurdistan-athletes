# Coolify's proxy terminates HTTPS. This container speaks HTTP on port 80.
# Do not redirect every request to HTTPS here: with Cloudflare that becomes a redirect loop.

server {
    listen 80;
    listen [::]:80;
    server_name www.kurdistanathletes.com;

    return 301 https://kurdistanathletes.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kurdistanathletes.com _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        return 301 /;
    }

    location ~* \.(?:css|js|mjs|svg|jpg|jpeg|png|gif|webp|ico|woff2?)$ {
        expires 1h;
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
        expires -1;
    }
}
